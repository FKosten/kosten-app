function pad(n){ return String(n).padStart(2,'0'); }
function fmtHora(iso){ const d = new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fechaLocal(iso){ const d = new Date(iso); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowIso(){ return new Date().toISOString(); }
function fechaHoraCorta(iso){ return new Date(iso).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }); }
function mesTexto(periodo){ return new Date(periodo + 'T00:00:00').toLocaleDateString('es-AR', { month:'long', year:'numeric' }); }
function pesos(n){ return (n === null || n === undefined || n === '') ? '—' : '$' + Number(n).toLocaleString('es-AR'); }

// Hora sugerida dentro de X minutos, redondeada para arriba a múltiplos de 5.
function horaMasMinutos(mins){ const d = new Date(Date.now()+mins*60000); d.setMinutes(Math.ceil(d.getMinutes()/5)*5, 0, 0); return pad(d.getHours())+':'+pad(d.getMinutes()); }
// Selector de hora en 24 hs con dos desplegables (hora y minutos de a 5). El
// campo de hora del navegador, en algunos equipos (Safari/Mac), se veía AM/PM.
function selectorHoraHtml(id, valor){
  const [h, m] = valor.split(':');
  const opciones = (lista, elegido) => lista.map(x => `<option value="${x}" ${x===elegido?'selected':''}>${x}</option>`).join('');
  const horas = Array.from({ length:24 }, (_, i) => pad(i));
  const minutos = Array.from({ length:12 }, (_, i) => pad(i*5));
  return `<span class="hora-24"><select id="${id}-h" aria-label="Hora">${opciones(horas, h)}</select><b>:</b><select id="${id}-m" aria-label="Minutos">${opciones(minutos, m)}</select><span>hs</span></span>`;
}
function leerHora(id){
  const h = document.getElementById(id+'-h'), m = document.getElementById(id+'-m');
  return h && m ? h.value + ':' + m.value : '';
}
function ponerHora(id, valor){
  const [h, m] = valor.split(':');
  document.getElementById(id+'-h').value = h;
  document.getElementById(id+'-m').value = m;
}

function root(){ return document.getElementById('app-boot'); }
// QR del carnet, generado en el propio teléfono (anda sin internet).
function qrSvg(texto){
  try{
    const q = qrcode(0, 'M');
    q.addData(texto);
    q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch(e){
    return '<p class="hint" style="margin:0;">No se pudo generar el QR.</p>';
  }
}
// Guarda lo que el usuario está completando dentro de un contenedor, ejecuta
// fn (que lo vuelve a dibujar) y le devuelve los valores. Así la actualización
// automática cada 20 s no borra lo que alguien está eligiendo o escribiendo.
function conservarFormulario(cont, fn){
  if (!cont) return fn();
  const campos = {};
  cont.querySelectorAll('input[id], select[id], textarea[id]').forEach(el => {
    if (el.type === 'file') return;
    campos[el.id] = el.type === 'checkbox' ? el.checked : el.value;
  });
  const foco = document.activeElement && cont.contains(document.activeElement) ? document.activeElement.id : null;
  fn();
  Object.entries(campos).forEach(([id, valor]) => {
    const el = document.getElementById(id);
    if (!el || !cont.contains(el)) return;
    if (el.type === 'checkbox'){ el.checked = valor; return; }
    // Si lo que había elegido ya no está (ej. otro se llevó ese kayak), queda en "Elegí…".
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === valor)) return;
    el.value = valor;
  });
  if (foco){ const el = document.getElementById(foco); if (el) el.focus(); }
}

function calcularHoraEstimada(hora){
  const [hh,mm] = hora.split(':').map(Number);
  const est = new Date(); est.setHours(hh,mm,0,0);
  const ahora = Date.now();
  if (est.getTime() <= ahora){
    if (ahora - est.getTime() < 6*3600000) return { error: 'Esa hora ya pasó. Poné a qué hora pensás salir del agua.' };
    est.setDate(est.getDate()+1);
  }
  if (est.getTime() - ahora > 12*3600000) return { error: 'La hora estimada de salida tiene que ser dentro de las próximas 12 horas.' };
  return { est };
}
// Todo texto que escribe un usuario (nombres, comentarios, notas, etc.) pasa
// por acá antes de mostrarse, para que nadie pueda meter código en la página.
function escaparHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// CLIMA Y MAREAS (resumen en Mi fichaje + links a Windguru/Wisuki)
// =====================================================================
function descripcionClima(code){
  if (code === 0) return '☀️ Despejado';
  if ([1,2].includes(code)) return '🌤️ Poco nublado';
  if (code === 3) return '☁️ Nublado';
  if ([45,48].includes(code)) return '🌫️ Niebla';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️ Lluvia';
  if ([71,73,75,77,85,86].includes(code)) return '❄️ Nieve';
  if ([95,96,99].includes(code)) return '⛈️ Tormenta';
  return '🌡️';
}
function direccionViento(deg){
  const dirs = ['N','NE','E','SE','S','SO','O','NO'];
  return dirs[Math.round(deg/45) % 8];
}
// Flecha apuntando hacia donde SOPLA el viento (el dato de la API es de
// dónde VIENE, así que se gira 180° para que la flecha sea intuitiva).
function flechaViento(deg){
  return `<span style="display:inline-block;transform:rotate(${(deg+180)%360}deg);">↑</span>`;
}
function iniciarClima(){
  if (climaTimer) return;
  cargarClima();
  climaTimer = setInterval(cargarClima, 15*60*1000);
}
async function cargarClima(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CLIMA_LAT}&longitude=${CLIMA_LON}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=kmh&forecast_days=2&timezone=auto`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('status ' + resp.status);
    const data = await resp.json();
    const h = data.hourly;
    const ahora = new Date();
    let idx = h.time.findIndex(t => new Date(t) >= ahora);
    if (idx < 0) idx = 0;
    const paso = 3; // horas entre cada franja del pronóstico
    const cantidad = 4; // "ahora" + 3 franjas más = próximas ~9 horas
    const horas = [];
    for (let i = 0; i < cantidad; i++){
      const j = idx + i*paso;
      if (j >= h.time.length) break;
      horas.push({
        etiqueta: i===0 ? 'Ahora' : pad(new Date(h.time[j]).getHours())+'hs',
        temp: h.temperature_2m[j],
        viento: h.wind_speed_10m[j],
        dir: h.wind_direction_10m[j],
        code: h.weather_code[j],
      });
    }
    climaData = { horas };
  } catch(e){
    console.error('No se pudo cargar el clima:', e);
    climaData = null;
  }
  actualizarClimaDOM();
}
function franjaClimaHtml(f){
  return `
    <div style="flex:1;min-width:78px;text-align:center;background:var(--surface-2);border-radius:10px;padding:10px 6px;">
      <div class="hint" style="margin:0 0 4px;">${f.etiqueta}</div>
      <div style="font-size:1.3rem;line-height:1;">${descripcionClima(f.code).split(' ')[0]}</div>
      <div style="margin:4px 0;"><b>${Math.round(f.temp)}°C</b></div>
      <div class="hint" style="margin:0;">${flechaViento(f.dir)} ${Math.round(f.viento)} km/h ${direccionViento(f.dir)}</div>
    </div>`;
}
function actualizarClimaDOM(){
  const elAlerta = document.getElementById('clima-alerta');
  if (elAlerta) elAlerta.innerHTML = alertaVientoHtml();
  const el = document.getElementById('clima-resumen');
  if (!el) return;
  if (!climaData || !climaData.horas || climaData.horas.length === 0){
    el.innerHTML = 'No se pudo cargar el clima ahora.';
    return;
  }
  el.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;">${climaData.horas.map(franjaClimaHtml).join('')}</div>`;
}
function alertaVientoHtml(){
  if (!climaData || !climaData.horas || climaData.horas.length === 0) return '';
  const ahora = climaData.horas[0];
  if (Math.round(ahora.viento) < UMBRAL_VIENTO_ALERTA_KMH) return '';
  return `<div class="message msg-danger" style="margin:0 0 12px;">⚠️ Viento fuerte ahora mismo (${Math.round(ahora.viento)} km/h ${direccionViento(ahora.dir)}) — evaluá bien las condiciones antes de salir.</div>`;
}
function renderClimaCard(){
  const contenido = (climaData && climaData.horas && climaData.horas.length > 0)
    ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">${climaData.horas.map(franjaClimaHtml).join('')}</div>`
    : 'Cargando clima…';
  return `
    <div class="card">
      <h2 style="margin-bottom:2px;">Clima y mareas</h2>
      <p class="hint" style="margin:0 0 12px;">Próximas horas — viento en km/h, flecha = hacia dónde sopla.</p>
      <div id="clima-alerta">${alertaVientoHtml()}</div>
      <div id="clima-resumen">${contenido}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
        <a class="btn btn-ghost" style="text-decoration:none;" href="${WINDGURU_URL}" target="_blank" rel="noopener">Pronóstico completo en Windguru →</a>
        <a class="btn btn-ghost" style="text-decoration:none;" href="${WISUKI_TIDE_URL}" target="_blank" rel="noopener">Tabla de mareas en Wisuki →</a>
      </div>
    </div>`;
}

async function guardarNuevaPassword(){
  const pass = document.getElementById('np-pass').value;
  const pass2 = document.getElementById('np-pass2').value;
  const errEl = document.getElementById('np-err');
  errEl.textContent = '';
  if (pass.length < 6){ errEl.textContent = 'La contraseña necesita al menos 6 caracteres.'; return; }
  if (pass !== pass2){ errEl.textContent = 'Las dos contraseñas no coinciden.'; return; }
  const { error } = await sb.auth.updateUser({ password: pass });

async function hacerLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-pass').value;
  const errEl = document.getElementById('li-err');
  errEl.textContent = '';
  if (!email || !password){ errEl.textContent = 'Completá email y contraseña.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ errEl.textContent = traducirError(error.message); return; }

async function hacerSignup(){
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-pass').value;
  const errEl = document.getElementById('su-err');
  errEl.textContent = '';
  if (!email || !password){ errEl.textContent = 'Completá email y contraseña.'; return; }
  if (password.length < 6){ errEl.textContent = 'La contraseña necesita al menos 6 caracteres.'; return; }
  const codigo = (document.getElementById('su-codigo').value || '').replace(/\s/g, '').toUpperCase();
  if (altaRequiereCodigo){
    if (!codigo){ errEl.textContent = 'Poné tu código de adherente.'; return; }
    const { data: valido } = await sb.rpc('validar_codigo_alta', { p_codigo: codigo });
    if (!valido){ errEl.textContent = 'Ese código no es válido o ya fue usado. Si creés que es un error, avisale a la comisión.'; return; }
  }
  const { error } = await sb.auth.signUp({ email, password, options: { data: { codigo } } });
  if (error){ errEl.textContent = traducirError(error.message); return; }
  toast('Cuenta creada. Revisá tu email para confirmarla.');
  setAuthTab('login');
}
function traducirError(msg){
  if (/already registered|already exists/i.test(msg)) return 'Ese email ya tiene una cuenta creada.';
  if (/invalid login credentials/i.test(msg)) return 'Email o contraseña incorrectos.';
  if (/email not confirmed/i.test(msg)) return 'Todavía no confirmaste tu email — revisá tu casilla.';
  if (/database error saving new user/i.test(msg)) return 'No se pudo crear la cuenta. Revisá el código de adherente: puede estar mal escrito o ya haber sido usado.';
  if (/perfiles_dni_unico/.test(msg)) return 'Ese DNI ya está registrado en otra cuenta. Si es tuyo, avisale a la comisión.';
  if (/fichajes_un_ingreso_abierto/.test(msg)) return 'Ya tenés un ingreso abierto. Fichá la salida antes de volver a entrar.';
  if (/equipo_numero_unico/.test(msg)) return 'Ya existe un equipo con ese número.';
  return msg;
}

async function guardarCarnet(){
  const errEl = document.getElementById('carnet-err');
  const telefono = document.getElementById('carnet-telefono').value.trim();
  const contacto_emergencia = document.getElementById('carnet-contacto-emergencia').value.trim();
  errEl.textContent = '';
  const cambios = [];
  if (telefono !== (perfil.telefono || '')) cambios.push(`Teléfono: ${perfil.telefono || '(vacío)'} → ${telefono || '(vacío)'}`);
  if (contacto_emergencia !== (perfil.contacto_emergencia || '')) cambios.push(`Contacto de emergencia: ${perfil.contacto_emergencia || '(vacío)'} → ${contacto_emergencia || '(vacío)'}`);
  if (cambios.length === 0){ closeModal('modal-carnet'); return; }
  if (!await confirmarAccion('¿Guardar estos cambios?', cambios)) return;
  const { error } = await sb.from('perfiles').update({ telefono, contacto_emergencia }).eq('id', session.user.id);
  if (error){ errEl.textContent = 'No se pudo guardar: ' + error.message; return; }
  perfil.telefono = telefono;
  perfil.contacto_emergencia = contacto_emergencia;
  toast('Tus datos se actualizaron.');
  closeModal('modal-carnet');
}

// Muestra el cartel "¿Estás seguro?" con el detalle de lo que se va a hacer
// (lineas = texto plano). Devuelve true si confirma, false si cancela.
function confirmarAccion(titulo, lineas){
  return new Promise(resolve => {
    document.getElementById('confirmar-titulo').textContent = titulo;
    document.getElementById('confirmar-detalle').innerHTML = lineas.map(l => `<li>${escaparHtml(l)}</li>`).join('');
    const ok = document.getElementById('confirmar-ok');
    const no = document.getElementById('confirmar-cancelar');
    const cerrar = (valor) => { closeModal('modal-confirmar'); ok.onclick = null; no.onclick = null; resolve(valor); };
    ok.onclick = () => cerrar(true);
    no.onclick = () => cerrar(false);
    openModal('modal-confirmar');
  });
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function estadoFichaje(f){
  if (f.estado !== 'en_agua') return 'cerrado';
  const est = new Date(f.hora_estimada_salida).getTime();
  const ahora = Date.now();
  if (ahora < est) return 'ok';
  if (ahora - est < 15*60000) return 'recordatorio';
  return 'alerta';
}
function labelEquipoItem(e){
  if (e.tipo==='embarcacion') return (e.subtipo==='sup' ? 'SUP ' : 'Kayak ') + e.numero;
  if (e.tipo==='remo') return 'Remo ' + e.numero;
  return 'Chaleco ' + e.numero;
}
function labelPropio(tipo){ return tipo==='embarcacion' ? 'Trae su propia embarcación' : tipo==='remo' ? 'Trae su propio remo' : 'Trae su propio chaleco'; }
function labelPropioCorto(tipo){ return tipo==='embarcacion' ? 'Embarcación propia' : tipo==='remo' ? 'Remo propio' : 'Chaleco propio'; }
function labelDe(id, tipo){
  if (!id) return labelPropioCorto(tipo);
  const e = equipo.find(x=>x.id===id);
  return e ? labelEquipoItem(e) : '—';
}
function refreshEquipoSelect(selectId, tipo, soloPropio){
  const sel = document.getElementById(selectId);
  if (!sel) return;
  if (soloPropio){
    sel.innerHTML = `<option value="propio" selected>${labelPropio(tipo)}</option>`;
    return;
  }
  const disponibles = equipo.filter(e => e.tipo===tipo && e.estado==='disponible')
    .sort((a,b)=> (a.subtipo||'').localeCompare(b.subtipo||'') || a.numero-b.numero);
  sel.innerHTML = `<option value="">Elegí…</option>` + disponibles.map(e=>`<option value="${e.id}">${labelEquipoItem(e)}</option>`).join('') + `<option value="propio">${labelPropio(tipo)}</option>`;
}
function faltaElegirEquipo(ids){ return ids.some(id => !document.getElementById(id).value); }
function resolverSeleccion(selectId){
  const val = document.getElementById(selectId).value;
  return (!val || val === 'propio') ? null : val;
}

// Le pide a la base solo los fichajes del día elegido (de 00:00 a 24:00 hora local).
async function renderStaffHistory(){
  const cont = document.getElementById('staff-history');
  const inputFecha = document.getElementById('hist-fecha');
  if (!cont || !inputFecha) return;
  if (!inputFecha.value) inputFecha.value = fechaLocal(nowIso());
  const fecha = inputFecha.value;
  const pedido = ++historialPedido;
  const desde = new Date(fecha + 'T00:00:00');
  const hasta = new Date(desde); hasta.setDate(hasta.getDate() + 1);
  const { data, error } = await sb.from('fichajes').select('*, perfiles(nombre,apellido)')
    .gte('hora_ingreso', desde.toISOString()).lt('hora_ingreso', hasta.toISOString())
    .order('hora_ingreso', { ascending:false });
  if (pedido !== historialPedido) return;  // ya se eligió otra fecha mientras cargaba
  if (error){ cont.innerHTML = `<p class="empty">No se pudo cargar el historial: ${escaparHtml(error.message)}</p>`; return; }
  historialFichajes = data || [];
  const delDia = historialFichajes;
  if (delDia.length === 0){ cont.innerHTML = '<p class="empty">No hay fichajes registrados ese día.</p>'; return; }
  cont.innerHTML = delDia.map(f=>{
    const nombreSocio = f.perfiles ? [f.perfiles.nombre, f.perfiles.apellido].filter(Boolean).join(' ') : '';
    const nombre = f.es_esporadico ? (f.nombre_esporadico||'Esporádico') : (nombreSocio || 'Adherente');
    const salida = f.estado === 'cerrado' && f.hora_salida_real ? fmtHora(f.hora_salida_real) : 'sigue en el agua';
    return `
      <div class="board-row">
        <div class="board-name">${escaparHtml(nombre)}${f.es_esporadico ? '<span class="tag-esp">esporádico</span>' : ''}</div>
        <div class="board-equip">
          <span class="equip-tag">🛶 ${labelDe(f.embarcacion_id,'embarcacion')}</span>
          <span class="equip-tag">🪛 ${labelDe(f.remo_id,'remo')}</span>

        <div class="board-time">Ingreso <b>${fmtHora(f.hora_ingreso)}</b> · Salida <b>${salida}</b></div>
      </div>`;
  }).join('');
}

async function ficharIngreso(){
  const errEl = document.getElementById('nf-err');
  const hora = leerHora('nf-hora');
  if (!hora){ errEl.textContent = 'Poné una hora estimada de salida.'; return; }
  if (faltaElegirEquipo(['nf-embarcacion','nf-remo','nf-chaleco'])){ errEl.textContent = 'Elegí embarcación, remo y chaleco (o marcá que traés el tuyo).'; return; }
  const embarcacion_id = resolverSeleccion('nf-embarcacion');
  const remo_id = resolverSeleccion('nf-remo');
  const chaleco_id = resolverSeleccion('nf-chaleco');
  if (perfil.cuota_vencida && (embarcacion_id || remo_id || chaleco_id)){
    errEl.textContent = 'Tu contribución está vencida — solo podés fichar con equipo propio.';
    return;
  }
  const { est, error: errHora } = calcularHoraEstimada(hora);
  if (errHora){ errEl.textContent = errHora; return; }

  const { error } = await sb.from('fichajes').insert({
    socio_id: session.user.id, es_esporadico: false,
    embarcacion_id, remo_id, chaleco_id,
    hora_estimada_salida: est.toISOString(), marcado_por: 'socio'
  });
  if (error){ errEl.textContent = 'No se pudo fichar: ' + traducirError(error.message); return; }
  // El equipo pasa a "en uso" solo: lo hace un trigger en la base (on_fichaje_equipo).
  toast('Ingreso fichado. ¡Buena navegada!');
  await cargarDatos(); renderSocioContent();
  if (perfil.rol==='staff'||perfil.rol==='admin'){ renderStaffSummary(); renderStaffBoard(); renderStaffHistory(); }
}

async function ficharSalida(fichajeId, desdeStaff){
  const f = fichajes.find(x=>x.id===fichajeId) || misFichajes.find(x=>x.id===fichajeId);
  if (!f) return;
  if (desdeStaff){
    const ok = await confirmarAccion('¿Marcar la salida?', [
      `Persona: ${nombreDeFichaje(f)}`,
      `Ingresó a las ${fmtHora(f.hora_ingreso)} · salida estimada ${fmtHora(f.hora_estimada_salida)}`,
      'Se registra la salida con la hora de ahora y el equipo vuelve a quedar disponible.'
    ]);
    if (!ok) return;
  }
  const { error } = await sb.from('fichajes').update({ hora_salida_real: nowIso(), estado:'cerrado', marcado_por: desdeStaff?'staff':'socio' }).eq('id', fichajeId);
  if (error){ toast('No se pudo marcar la salida: ' + error.message); return; }
  // El equipo vuelve a "disponible" solo: lo hace un trigger en la base (on_fichaje_equipo).
  toast(desdeStaff ? 'Salida marcada por staff.' : 'Salida fichada. ¡Bienvenido a tierra!');
  await cargarDatos(); renderSocioContent();
  if (perfil.rol==='staff'||perfil.rol==='admin'){ renderStaffSummary(); renderStaffBoard(); renderStaffHistory(); }
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function renderPushBanner(){
  const cont = document.getElementById('push-banner');
  if (!cont) return;
  const soportado = 'serviceWorker' in navigator && 'PushManager' in window;
  if (!soportado){ cont.innerHTML = ''; return; }
  if (Notification.permission === 'granted'){
    // Ya tiene permiso del navegador; nos aseguramos de que la suscripción
    // esté guardada en la base (por si se perdió, ej. tras reinstalar la PWA).
    asegurarSuscripcion().catch(()=>{});
    cont.innerHTML = '';
    return;
  }
  if (Notification.permission === 'denied'){
    cont.innerHTML = `<p class="hint" style="margin:0 0 4px;">🔕 Tenés las notificaciones bloqueadas en este navegador. Activalas desde la configuración del sitio si querés recibir avisos.</p>`;
    return;
  }
  cont.innerHTML = `
    <div class="card" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <span class="hint" style="margin:0;">🔔 Activá las notificaciones para recibir el recordatorio de salida.</span>
      <button class="btn btn-primary" onclick="activarNotificaciones()">Activar notificaciones</button>
    </div>`;
}

async function activarNotificaciones(){
  try{
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted'){ toast('No se activaron las notificaciones.'); renderPushBanner(); return; }
    await asegurarSuscripcion();
    toast('¡Notificaciones activadas!');
  } catch(e){
    toast('No se pudo activar: ' + e.message);
  }
  renderPushBanner();
}

async function asegurarSuscripcion(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub){
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }
  const json = sub.toJSON();
  await sb.from('push_subscriptions').upsert({
    user_id: session.user.id,
    endpoint: json.endpoint,
    p256dh: json.keys.p256dh,
    auth: json.keys.auth
  }, { onConflict: 'endpoint' });
}

async function agregarCredencial(){

async function borrarCredencial(id){

  const quien = c && c.perfiles ? [c.perfiles.nombre, c.perfiles.apellido].filter(Boolean).join(' ') : 'adherente';
  if (!await confirmarAccion('¿Quitar esta credencial?', [`${c ? c.nombre : 'Credencial'} de ${quien || 'adherente'}`])) return;
  const { error } = await sb.from('credenciales').delete().eq('id', id);

function tiempoRelativo(iso){
  const d = new Date(iso);
  const seg = Math.floor((Date.now() - d.getTime()) / 1000);
  if (seg < 60) return 'recién';
  const min = Math.floor(seg / 60);
  if (min < 60) return `hace ${min} min`;
  const hs = Math.floor(min / 60);
  if (hs < 24) return `hace ${hs} h`;
  const dias = Math.floor(hs / 24);
  if (dias < 7) return `hace ${dias} d`;
  return d.toLocaleDateString('es-AR');
}
function fechaCorta(fecha){
  const d = new Date(fecha + 'T00:00:00');
  return d.toLocaleDateString('es-AR');
}

// Achica la foto antes de subirla (máx. 1600 px, JPEG): una foto de celu de
// 3-5 MB queda en unos 200-400 KB. Si el navegador no puede, sube la original.
async function achicarImagen(archivo, maxLado = 1600, calidad = 0.82){
  try{
    const bmp = await createImageBitmap(archivo);
    const escala = Math.min(1, maxLado / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * escala);
    canvas.height = Math.round(bmp.height * escala);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', calidad));
    return blob || archivo;
  } catch(e){
    return archivo;
  }
}
// De la URL pública de la foto saca la ruta dentro del bucket "anuncios".
function rutaImagenAnuncio(url){
  const i = url ? url.indexOf('/anuncios/') : -1;
  return i < 0 ? null : decodeURIComponent(url.slice(i + '/anuncios/'.length));
}
async function agregarAnuncio(){
  const errEl = document.getElementById('an-err');
  const btn = document.getElementById('an-btn-publicar');
  const titulo = document.getElementById('an-titulo').value.trim();
  const cuerpo = document.getElementById('an-cuerpo').value.trim();
  const vigencia = document.getElementById('an-vigencia').value;
  const archivo = document.getElementById('an-imagen').files[0];
  errEl.textContent = '';
  if (!titulo){ errEl.textContent = 'Poné un título.'; return; }
  if (!cuerpo){ errEl.textContent = 'Poné el detalle del anuncio.'; return; }
  if (!vigencia){ errEl.textContent = 'Elegí hasta cuándo se muestra.'; return; }
  if (!await confirmarAccion('¿Publicar este anuncio?', [
    `Título: ${titulo}`,
    `Visible hasta el ${fechaCorta(vigencia)}`,
    archivo ? 'Con foto' : 'Sin foto',
    'Les llega una notificación a todos los adherentes.'
  ])) return;
  btn.disabled = true;
  let imagen_url = null;
  if (archivo){
    const imagen = await achicarImagen(archivo);
    const nombre = imagen === archivo ? archivo.name : archivo.name.replace(/\.[^.]*$/, '') + '.jpg';
    const ruta = `${Date.now()}-${nombre}`.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const { error: errSubida } = await sb.storage.from('anuncios').upload(ruta, imagen, { contentType: imagen.type || archivo.type });
    if (errSubida){
      errEl.textContent = 'No se pudo subir la foto: ' + errSubida.message;
      btn.disabled = false;
      return;
    }
    imagen_url = sb.storage.from('anuncios').getPublicUrl(ruta).data.publicUrl;
  }
  const { error } = await sb.from('anuncios').insert({
    titulo, cuerpo, fecha_vigencia_hasta: vigencia, creado_por: session.user.id, imagen_url
  });
  btn.disabled = false;
  if (error){ errEl.textContent = 'No se pudo publicar: ' + error.message; return; }
  document.getElementById('an-titulo').value = '';
  document.getElementById('an-cuerpo').value = '';
  document.getElementById('an-imagen').value = '';
  document.getElementById('an-vigencia').value = fechaLocal(nowIso());
  toast('Anuncio publicado — se les avisa a los adherentes.');
  await cargarAnuncios(); renderStaffAnuncios(); renderAnunciosSocio();
}
async function borrarAnuncioManual(id){
  const anuncio = anuncios.find(a => a.id === id);
  if (!await confirmarAccion('¿Quitar este anuncio?', [
    `"${anuncio ? anuncio.titulo : ''}"`,
    'Se borran también su foto, sus "me gusta" y sus comentarios.'
  ])) return;
  const { error } = await sb.from('anuncios').delete().eq('id', id);
  if (error){ toast('No se pudo quitar: ' + error.message); return; }
  const ruta = rutaImagenAnuncio(anuncio && anuncio.imagen_url);
  if (ruta) await sb.storage.from('anuncios').remove([ruta]);
  toast('Anuncio quitado.');
  await cargarAnuncios(); renderStaffAnuncios(); renderAnunciosSocio();
}

function datetimeLocalDeIso(iso){
  if (!iso) return '';
  const d = new Date(iso);
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,16);
}
function isoDeDatetimeLocal(valor){
  if (!valor) return null;
  return new Date(valor).toISOString();
}

async function guardarNuevoRegistroBitacora(){
  const errEl = document.getElementById('bit-nuevo-err');
  const ingreso = document.getElementById('bit-nuevo-ingreso').value;
  const salida = document.getElementById('bit-nuevo-salida').value;
  const nota = document.getElementById('bit-nuevo-nota').value.trim() || null;
  errEl.textContent = '';
  if (!ingreso || !salida){ errEl.textContent = 'Completá entrada y salida.'; return; }
  const ingresoIso = isoDeDatetimeLocal(ingreso);
  const salidaIso = isoDeDatetimeLocal(salida);
  if (new Date(salidaIso) <= new Date(ingresoIso)){ errEl.textContent = 'La salida tiene que ser después de la entrada.'; return; }
  const { error } = await sb.from('fichajes').insert({
    socio_id: session.user.id,
    es_esporadico: false,
    hora_ingreso: ingresoIso,
    hora_estimada_salida: salidaIso,
    hora_salida_real: salidaIso,
    marcado_por: 'socio',
    estado: 'cerrado',
    cargado_manual: true,
    nota,
  });
  if (error){ errEl.textContent = 'No se pudo guardar: ' + error.message; return; }
  bitacoraNuevoAbierto = false;
  toast('Registro agregado a tu bitácora.');
  await cargarDatos(); renderBitacora();
}

  bitacoraEditando = id;
  bitacoraNuevoAbierto = false;

async function guardarBitacora(id){
  const errEl = document.getElementById('bit-edit-err-'+id);
  const ingreso = document.getElementById('bit-edit-ingreso-'+id).value;
  const salidaEl = document.getElementById('bit-edit-salida-'+id);
  const salida = salidaEl.value;
  const nota = document.getElementById('bit-edit-nota-'+id).value.trim() || null;
  errEl.textContent = '';
  if (!ingreso){ errEl.textContent = 'Falta la fecha/hora de entrada.'; return; }
  const payload = { hora_ingreso: isoDeDatetimeLocal(ingreso), nota };
  if (!salidaEl.disabled && salida){
    if (new Date(isoDeDatetimeLocal(salida)) <= new Date(payload.hora_ingreso)){
      errEl.textContent = 'La salida tiene que ser después de la entrada.';
      return;
    }
    payload.hora_salida_real = isoDeDatetimeLocal(salida);
  }
  const f = misFichajes.find(x => x.id === id);
  const cambios = [];
  if (f){
    if (new Date(payload.hora_ingreso).getTime() !== new Date(f.hora_ingreso).getTime()) cambios.push(`Entrada: ${fechaHoraCorta(f.hora_ingreso)} → ${fechaHoraCorta(payload.hora_ingreso)}`);
    if (payload.hora_salida_real && new Date(payload.hora_salida_real).getTime() !== new Date(f.hora_salida_real).getTime()) cambios.push(`Salida: ${f.hora_salida_real ? fechaHoraCorta(f.hora_salida_real) : '—'} → ${fechaHoraCorta(payload.hora_salida_real)}`);
    if ((payload.nota || '') !== (f.nota || '')) cambios.push(`Nota: ${f.nota || '(vacía)'} → ${payload.nota || '(vacía)'}`);
  }
  if (cambios.length === 0){ cancelarEdicionBitacora(); return; }
  if (!await confirmarAccion('¿Guardar los cambios en tu bitácora?', cambios)) return;
  const { error } = await sb.from('fichajes').update(payload).eq('id', id);
  if (error){ errEl.textContent = 'No se pudo guardar: ' + error.message; return; }
  bitacoraEditando = null;
  toast('Bitácora actualizada.');
  await cargarDatos(); renderBitacora();
}

  const socio = socios.find(s => s.id === socioId);
  if (!await confirmarAccion('¿Asociar este pago?', [
    `Pago de ${pago.nombre_pagador || 'sin nombre'} (${pesos(pago.monto)}${pago.dni_recibido ? ', DNI ' + pago.dni_recibido : ''})`,
    `Se asigna a: ${socio ? nombreAdherente(socio) : '—'}`,
    `Mes: ${pago.periodo ? mesTexto(pago.periodo) : '—'}`
  ])) return;
  const { error: e1 } = await sb.from('cuotas').upsert({
    socio_id: socioId, periodo: pago.periodo, monto: pago.monto, fecha_pago: pago.fecha_pago,
    medio: 'mercado_pago', mp_payment_id: pago.mp_payment_id
  }, { onConflict: 'socio_id,periodo' });
  if (e1){ toast('No se pudo asociar: ' + e1.message); return; }
  await sb.from('perfiles').update({ cuota_vencida: false }).eq('id', socioId);
  await sb.from('pagos_sin_asociar').update({ estado:'asociado', asociado_a: socioId, resuelto_por: session.user.id, resuelto_en: nowIso() }).eq('id', pagoId);
  toast('Pago asociado.');
  await cargarDatosStaffCuotas(); refrescarSelectSocios(); renderStaffVencidos(); renderPagosSinAsociar();
}

// =====================================================================
// REGISTRO DE CAMBIOS (lo anota la base sola; acá solo se muestra)
// =====================================================================
const REGISTRO_POR_PAGINA = 100;
let registro = [];
let registroNombres = {};
let registroHayMas = false;
const NOMBRE_TABLA = {
  perfiles:'el perfil de', equipo:'el equipo', fichajes:'el fichaje de', cuotas:'la contribución de',
  pagos_sin_asociar:'el pago de Mercado Pago de', credenciales:'la credencial', anuncios:'el anuncio',
  anuncio_comentarios:'el comentario', terminos_condiciones:'los términos y condiciones'
};
const NOMBRE_CAMPO = {
  nombre:'Nombre', apellido:'Apellido', dni:'DNI', fecha_nacimiento:'Fecha de nacimiento', telefono:'Teléfono',
  email:'Email', contacto_emergencia:'Contacto de emergencia', rol:'Rol', estado:'Estado', acepta_tyc:'Aceptó T&C',
  fecha_tyc:'Fecha T&C', version_tyc:'Versión T&C', cuota_vencida:'Contribución vencida', numero_socio:'N.° de adherente',
  tipo:'Tipo', subtipo:'Subtipo', numero:'Número', embarcacion_id:'Embarcación', remo_id:'Remo', chaleco_id:'Chaleco',
  hora_ingreso:'Ingreso', hora_estimada_salida:'Salida estimada', hora_salida_real:'Salida', marcado_por:'Marcado por',
  nota:'Nota', periodo:'Mes', monto:'Monto', monto_neto:'Monto neto', fecha_pago:'Fecha de pago', medio:'Medio',
  notas:'Notas', asociado_a:'Asociado a', resuelto_por:'Resuelto por', resuelto_en:'Resuelto el', fecha:'Fecha',
  vencimiento:'Vencimiento', certificado_por:'Certificado por', titulo:'Título', cuerpo:'Detalle',
  fecha_vigencia_hasta:'Visible hasta', imagen_url:'Foto', texto:'Texto', socio_id:'Adherente', registrado_por:'Registrado por'
};
const VALOR_LEGIBLE = {
  disponible:'Disponible', en_uso:'En uso', mantenimiento:'En mantenimiento', de_baja:'De baja',
  en_agua:'En el agua', cerrado:'Cerrado', socio:'Adherente', staff:'Staff', admin:'Admin',
  activo:'Activo', inactivo:'Inactivo', mercado_pago:'Mercado Pago', manual:'Manual',
  pendiente:'Pendiente', asociado:'Asociado', descartado:'Descartado',
  embarcacion:'Embarcación', remo:'Remo', chaleco:'Chaleco', kayak:'Kayak', sup:'SUP'
};

async function cargarRegistro(mas){
  const cont = document.getElementById('staff-registro');
  if (!cont) return;
  const desde = mas ? registro.length : 0;
  const [{ data, error }, { data: perfs }] = await Promise.all([
    sb.from('registro_cambios').select('*').order('creado_en', { ascending:false }).range(desde, desde + REGISTRO_POR_PAGINA - 1),
    sb.from('perfiles').select('id,nombre,apellido')
  ]);
  if (error){ cont.innerHTML = `<p class="empty">No se pudo cargar el registro: ${escaparHtml(error.message)}</p>`; return; }
  (perfs || []).forEach(p => { registroNombres[p.id] = [p.nombre, p.apellido].filter(Boolean).join(' ') || 'Adherente'; });
  registro = mas ? registro.concat(data || []) : (data || []);
  registroHayMas = (data || []).length === REGISTRO_POR_PAGINA;
  renderRegistro();
}
function recortar(s, n = 80){ s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function valorLegible(campo, v){
  if (v === null || v === undefined || v === '') return '(vacío)';
  if (typeof v === 'boolean') return v ? 'Sí' : 'No';
  if (['embarcacion_id','remo_id','chaleco_id'].includes(campo)){ const e = equipo.find(x => x.id === v); return e ? labelEquipoItem(e) : 'equipo'; }
  if (['socio_id','asociado_a','resuelto_por','registrado_por','creado_por'].includes(campo)) return registroNombres[v] || 'adherente';
  if (campo === 'periodo') return mesTexto(v);
  if (campo === 'monto' || campo === 'monto_neto') return pesos(v);
  if (campo === 'imagen_url') return 'foto';
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fechaHoraCorta(v);
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fechaCorta(v);
  if (VALOR_LEGIBLE[v]) return VALOR_LEGIBLE[v];
  return recortar(v);
}
// "De qué" se trata el cambio, en palabras (ej. "Kayak 3", "Juan Pérez, octubre de 2026").
function sujetoDelCambio(r){
  const f = r.fila || {};
  const persona = id => registroNombres[id] || 'adherente';
  switch (r.tabla){
    case 'perfiles': return [f.nombre, f.apellido].filter(Boolean).join(' ') || f.email || 'adherente';
    case 'equipo': return labelEquipoItem(f);
    case 'fichajes': return (f.es_esporadico ? (f.nombre_esporadico || 'esporádico') + ' (esporádico)' : persona(f.socio_id)) + (f.hora_ingreso ? ', ingreso ' + fechaHoraCorta(f.hora_ingreso) : '');
    case 'cuotas': return persona(f.socio_id) + (f.periodo ? ', ' + mesTexto(f.periodo) : '');
    case 'pagos_sin_asociar': return (f.nombre_pagador || 'sin nombre') + (f.monto ? ', ' + pesos(f.monto) : '');
    case 'credenciales': return `"${f.nombre}" de ${persona(f.socio_id)}`;
    case 'anuncios': return `"${recortar(f.titulo, 60)}"`;
    case 'anuncio_comentarios': return `de ${persona(f.socio_id)}: "${recortar(f.texto, 60)}"`;
    case 'terminos_condiciones': return 'versión ' + (f.version || '');
    default: return '';
  }
}
function renderRegistro(){
  const cont = document.getElementById('staff-registro');
  if (!cont) return;
  if (registro.length === 0){ cont.innerHTML = '<p class="empty">Todavía no hay cambios registrados.</p>'; return; }
  const verbo = { alta:'agregó', modificacion:'modificó', baja:'borró' };
  cont.innerHTML = registro.map(r => {
    const quien = r.usuario_nombre || (r.usuario_id ? (registroNombres[r.usuario_id] || 'Un usuario') : 'El sistema (automático)');
    const cambios = r.accion === 'modificacion' && r.despues
      ? Object.keys(r.despues).map(k => `<div class="hint" style="margin:2px 0 0;">${escaparHtml(NOMBRE_CAMPO[k] || k)}: ${escaparHtml(valorLegible(k, r.antes && r.antes[k]))} → <b>${escaparHtml(valorLegible(k, r.despues[k]))}</b></div>`).join('')
      : '';
    return `
      <div class="history-item" style="display:block;">
        <div><b>${escaparHtml(quien)}</b> ${verbo[r.accion]} ${escaparHtml(NOMBRE_TABLA[r.tabla] || r.tabla)} <b>${escaparHtml(sujetoDelCambio(r))}</b></div>
        ${cambios}
        <div class="hint" style="margin:3px 0 0;font-size:0.76rem;">${escaparHtml(fechaHoraCorta(r.creado_en))}</div>
      </div>`;
  }).join('') + (registroHayMas ? '<button class="btn btn-ghost" style="margin-top:10px;width:100%;" onclick="cargarRegistro(true)">Ver más</button>' : '');
}
</script>
