<style>
  :root{
    color-scheme: light dark;
    --bg:#EEF3F2; --surface:#FFFFFF; --surface-2:#E4ECEA;
    --ink:#12303A; --ink-soft:#4B6169; --ink-faint:#7E9198;
    --accent:#0E6E77; --accent-strong:#0A545C; --accent-ink:#FFFFFF;
    --line:#D3DFDD;
    --good:#1E7A4C; --good-bg:#E1F1E7;
    --warn:#B8790A; --warn-bg:#FBEDD4;
    --danger:#B23A2E; --danger-bg:#F8E2DF;
    --logo-filter:none;
    --shadow: 0 1px 2px rgba(18,48,58,0.06), 0 8px 24px -12px rgba(18,48,58,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1A1E; --surface:#12292F; --surface-2:#0F2227;
      --ink:#E7F1EF; --ink-soft:#9FB6BA; --ink-faint:#6C8489;
      --accent:#4FC3BE; --accent-strong:#6ED4CF; --accent-ink:#06171A;
      --line:#234046; --good:#4CAF7D; --good-bg:#123024;
      --warn:#E0A63A; --warn-bg:#33260D; --danger:#E5695C; --danger-bg:#3A1714;
      --logo-filter:invert(1);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1A1E; --surface:#12292F; --surface-2:#0F2227;
    --ink:#E7F1EF; --ink-soft:#9FB6BA; --ink-faint:#6C8489;
    --accent:#4FC3BE; --accent-strong:#6ED4CF; --accent-ink:#06171A;
    --line:#234046; --good:#4CAF7D; --good-bg:#123024;
    --warn:#E0A63A; --warn-bg:#33260D; --danger:#E5695C; --danger-bg:#3A1714;
    --logo-filter:invert(1);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Karla',system-ui,-apple-system,sans-serif;
    padding-inline:16px;padding-block:20px 48px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-mark{height:38px;width:auto;display:block;filter:var(--logo-filter);}
  .brand .suffix{font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:1.3rem;}
  .signout{background:transparent;border:1px solid var(--line);color:var(--ink-soft);border-radius:9px;padding:8px 12px;font-family:'Archivo',sans-serif;font-weight:700;font-size:0.82rem;cursor:pointer;}
  .signout:hover{background:var(--surface-2);}
  .hello{color:var(--ink-soft);font-size:0.85rem;}
  .hello b{color:var(--ink);}

  .tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;}
  .tab-btn{flex:1;border:none;background:transparent;color:var(--ink-soft);font-family:'Archivo',sans-serif;font-weight:700;font-size:0.92rem;padding:10px 12px;border-radius:9px;cursor:pointer;}
  .tab-btn.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .panel{display:none;flex-direction:column;gap:16px;}
  .panel.active{display:flex;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);}
  .card h2{margin:0 0 4px;font-family:'Archivo',sans-serif;font-size:1.05rem;font-weight:700;}
  .card .hint{color:var(--ink-soft);font-size:0.85rem;margin:0 0 12px;}
  .center-card{max-width:420px;margin:40px auto 0;}

  label.field{display:flex;flex-direction:column;gap:6px;font-size:0.85rem;color:var(--ink-soft);font-weight:600;}
  label.field span{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.04em;}
  select,input[type="text"],input[type="time"],input[type="tel"],input[type="email"],input[type="password"],input[type="date"]{
    font-family:'Karla',sans-serif;font-size:0.95rem;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;
  }
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:480px){.row3{grid-template-columns:1fr;}}
  .stack{display:flex;flex-direction:column;gap:12px;}

  .btn{font-family:'Archivo',sans-serif;font-weight:700;font-size:0.95rem;border-radius:11px;border:1px solid transparent;padding:13px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;color:var(--accent);border-color:var(--line);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-big{width:100%;padding:18px;font-size:1.05rem;border-radius:13px;}
  .btn[disabled]{opacity:0.5;cursor:not-allowed;}
  .btn-link{background:none;border:none;color:var(--accent);font-family:'Karla',sans-serif;font-weight:700;cursor:pointer;padding:0;font-size:0.88rem;}

  .ticket{background:linear-gradient(180deg,var(--surface) 0%, var(--surface-2) 100%);border:1px dashed var(--line);border-radius:16px;padding:20px;position:relative;}
  .ticket .status-chip{position:absolute;top:16px;right:16px;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;font-weight:600;padding:4px 10px;border-radius:100px;}
  .chip-ok{background:var(--good-bg);color:var(--good);}
  .chip-warn{background:var(--warn-bg);color:var(--warn);}
  .chip-danger{background:var(--danger-bg);color:var(--danger);}
  .clock-label{color:var(--ink-soft);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;}
  .clock{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:2.2rem;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums;}
  .equip-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px;}
  .equip-tag{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink-soft);}
  .message{font-size:0.85rem;margin-bottom:12px;}
  .msg-ok{color:var(--ink-soft);}
  .msg-warn{color:var(--warn);}
  .msg-danger{color:var(--danger);font-weight:600;}

  .board-row{display:grid;grid-template-columns:1.3fr 1.6fr 0.9fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);}
  .board-row + .board-row{margin-top:8px;}
  @media (max-width:600px){.board-row{grid-template-columns:1fr;gap:8px;}}
  .board-name{font-weight:700;font-size:0.92rem;}
  .tag-esp{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:1px 6px;margin-left:6px;}
  .board-equip{display:flex;gap:6px;flex-wrap:wrap;}
  .board-time{font-family:'IBM Plex Mono',monospace;font-size:0.82rem;color:var(--ink-soft);}
  .board-time b{color:var(--ink);}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .dot-ok{background:var(--good);} .dot-warn{background:var(--warn);} .dot-danger{background:var(--danger);}
  .empty{color:var(--ink-faint);font-size:0.88rem;padding:18px 4px;text-align:center;}

  .summary-strip{display:flex;gap:10px;flex-wrap:wrap;}
  .summary-tile{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;}
  .summary-tile .n{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.3rem;}
  .summary-tile .l{color:var(--ink-soft);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;}

  .history-item{display:flex;justify-content:space-between;font-size:0.82rem;color:var(--ink-soft);padding:7px 0;border-bottom:1px solid var(--line);}
  .history-item:last-child{border-bottom:none;}
  .history-item b{color:var(--ink);}

  .tyc-box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:0.8rem;color:var(--ink-soft);line-height:1.5;max-height:160px;overflow-y:auto;white-space:pre-wrap;}
  .draft-flag{color:var(--danger);font-weight:700;display:block;margin-top:8px;}
  .checkline{display:flex;align-items:flex-start;gap:9px;font-size:0.85rem;}
  .checkline input{margin-top:3px;}

  .overlay{position:fixed;inset:0;background:rgba(11,26,30,0.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.open{display:flex;}
  @media (min-width:560px){.overlay{align-items:center;padding:20px;}}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:22px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
  @media (min-width:560px){.modal{border-radius:18px;}}
  .modal h3{margin:0;font-family:'Archivo',sans-serif;font-size:1.1rem;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:0.85rem;font-weight:600;padding:11px 18px;border-radius:100px;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .errtext{color:var(--danger);font-size:0.82rem;min-height:1.1em;}
  [hidden]{display:none!important;}
</style>
</head>

<script>

const SUPABASE_URL = "https://cmwdkrgshsfrhtduszdq.supabase.co";

// Clave pública VAPID (segura de exponer — es la mitad "pública" del par
// de claves que identifica a esta app frente a los navegadores para poder
// mandarle notificaciones push). La clave privada vive solo en Supabase.
const VAPID_PUBLIC_KEY = "BNGyYA_7IvMTzwEEp8pTG6RiBMe4aqKB1aqcuLlbOR2ycwatUdOEypNXp7d9h8dbaEVCuHUhy3RORTV-6_ofZ0g";

// =====================================================================

// Ubicación aproximada de Caleta Olivia (para el resumen de clima).
const CLIMA_LAT = -46.4333;
const CLIMA_LON = -67.5333;
const WINDGURU_URL = 'https://www.windguru.cz/51506';
const WISUKI_TIDE_URL = 'https://wisuki.com/tide/5698/caleta-olivia';

function pad(n){ return String(n).padStart(2,'0'); }
function fmtHora(iso){ const d = new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fechaLocal(iso){ const d = new Date(iso); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowIso(){ return new Date().toISOString(); }
function horaMasMinutos(mins){ const d = new Date(Date.now()+mins*60000); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 3200);
}
function root(){ return document.getElementById('app-boot'); }

// =====================================================================
// CLIMA Y MAREAS (resumen en Mi fichaje + links a Windguru/Wisuki)
// =====================================================================
function descripcionClima(code){
  if (code === 0) return '☀️ Despejado';
  if ([1,2].includes(code)) return '🌤️ Poco nublado';
  if (code === 3) return '☁️ Nublado';
  if ([45,48].includes(code)) return '🌫️ Niebla';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️ Lluvia';
  if ([71,73,75,77,85,86].includes(code)) return '❄️ Nieve';
  if ([95,96,99].includes(code)) return '⛈️ Tormenta';
  return '🌡️';
}
function direccionViento(deg){
  const dirs = ['N','NE','E','SE','S','SO','O','NO'];
  return dirs[Math.round(deg/45) % 8];
}
function iniciarClima(){
  if (climaTimer) return;
  cargarClima();
  climaTimer = setInterval(cargarClima, 15*60*1000);
}
async function cargarClima(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CLIMA_LAT}&longitude=${CLIMA_LON}&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=kmh&timezone=auto`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('status ' + resp.status);
    const data = await resp.json();
    climaData = data.current || null;
  } catch(e){
    console.error('No se pudo cargar el clima:', e);
  }
  actualizarClimaDOM();
}
function actualizarClimaDOM(){
  const el = document.getElementById('clima-resumen');
  if (!el) return;
  if (!climaData){ el.textContent = 'No se pudo cargar el clima ahora.'; return; }
  el.innerHTML = `${descripcionClima(climaData.weather_code)} · <b>${Math.round(climaData.temperature_2m)}°C</b> · viento ${Math.round(climaData.wind_speed_10m)} km/h ${direccionViento(climaData.wind_direction_10m)}`;
}
function renderClimaCard(){
  const resumen = climaData
    ? `${descripcionClima(climaData.weather_code)} · <b>${Math.round(climaData.temperature_2m)}°C</b> · viento ${Math.round(climaData.wind_speed_10m)} km/h ${direccionViento(climaData.wind_direction_10m)}`
    : 'Cargando clima…';
  return `
    <div class="card">
      <h2 style="margin-bottom:2px;">Clima y mareas</h2>
      <p class="hint" id="clima-resumen" style="margin:0 0 12px;">${resumen}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a class="btn btn-ghost" style="text-decoration:none;" href="${WINDGURU_URL}" target="_blank" rel="noopener">Pronóstico completo en Windguru →</a>
        <a class="btn btn-ghost" style="text-decoration:none;" href="${WISUKI_TIDE_URL}" target="_blank" rel="noopener">Tabla de mareas en Wisuki →</a>
      </div>
    </div>`;
}

// =====================================================================
// ARRANQUE
// =====================================================================
async function boot(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s) => {
    session = s;
    if (_event === 'PASSWORD_RECOVERY') modoRecuperarPassword = true;
    render();
  });
  await render();
}

async function render(){
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if (modoRecuperarPassword){
    renderNuevaPassword();
    return;
  }
  if (!session){
    renderAuth();
    return;
  }
  const { data: p, error } = await sb.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error){ toast('Error cargando tu perfil: ' + error.message); }
  perfil = p;
  if (!perfil || !perfil.nombre || !perfil.acepta_tyc){
    await renderCompletarPerfil();
    return;
  }
  await renderApp();
}

// =====================================================================
// PANTALLA: LOGIN / REGISTRO
// =====================================================================
function renderAuth(){
  root().innerHTML = `
    <div class="top" style="justify-content:center;">
      <div class="brand">
        <img class="logo-mark" src="kosten-wordmark.png" alt="Fundación Kosten">
        <span class="suffix">Socios</span>
      </div>
    </div>
    <div class="card center-card">
      <div class="tabs" style="margin-bottom:16px;">
        <button class="tab-btn active" id="authtab-login" onclick="setAuthTab('login')">Ingresar</button>
        <button class="tab-btn" id="authtab-signup" onclick="setAuthTab('signup')">Crear cuenta</button>
      </div>

      <div id="auth-login" class="stack">
        <label class="field"><span>Email</span><input type="email" id="li-email"/></label>
        <label class="field"><span>Contraseña</span><input type="password" id="li-pass"/></label>
        <p class="errtext" id="li-err"></p>
        <button class="btn btn-primary btn-big" onclick="hacerLogin()">Ingresar</button>
        <button class="btn btn-ghost" style="margin-top:2px;" onclick="mostrarRecuperar()">¿Olvidaste tu contraseña?</button>
      </div>

      <div id="auth-recuperar" class="stack" hidden>
        <p class="hint" style="margin:0;">Ingresá tu email y te mandamos un link para elegir una contraseña nueva.</p>
        <label class="field"><span>Email</span><input type="email" id="rec-email"/></label>
        <p class="errtext" id="rec-err"></p>
        <button class="btn btn-primary btn-big" onclick="enviarRecuperar()">Enviar link</button>
        <button class="btn btn-ghost" style="margin-top:2px;" onclick="ocultarRecuperar()">Volver a ingresar</button>
      </div>

      <div id="auth-signup" class="stack" hidden>
        <label class="field"><span>Email</span><input type="email" id="su-email"/></label>

        <button class="btn btn-primary btn-big" onclick="hacerSignup()">Crear cuenta</button>
        <p class="hint" style="margin:0;">Después de crear la cuenta te va a llegar un email de confirmación — hay que abrirlo antes de poder ingresar.</p>
      </div>
    </div>
  `;
}
function setAuthTab(which){
  ocultarRecuperar();
  document.getElementById('auth-login').hidden = which!=='login';
  document.getElementById('auth-signup').hidden = which!=='signup';
  document.getElementById('authtab-login').classList.toggle('active', which==='login');
  document.getElementById('authtab-signup').classList.toggle('active', which==='signup');
}
function mostrarRecuperar(){
  document.getElementById('auth-login').hidden = true;
  document.getElementById('auth-recuperar').hidden = false;
  document.getElementById('rec-email').value = document.getElementById('li-email').value.trim();
}
function ocultarRecuperar(){
  document.getElementById('auth-recuperar').hidden = true;
  document.getElementById('auth-login').hidden = false;
}
async function enviarRecuperar(){
  const email = document.getElementById('rec-email').value.trim();
  const errEl = document.getElementById('rec-err');
  errEl.textContent = '';
  if (!email){ errEl.textContent = 'Poné tu email.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if (error){ errEl.textContent = traducirError(error.message); return; }
  toast('Te mandamos un email con el link para elegir una contraseña nueva.');
  ocultarRecuperar();
}
function renderNuevaPassword(){
  root().innerHTML = `
    <div class="top" style="justify-content:center;">
      <div class="brand">
        <img class="logo-mark" src="kosten-wordmark.png" alt="Fundación Kosten">
        <span class="suffix">Socios</span>
      </div>
    </div>
    <div class="card center-card">
      <h2 style="margin-top:0;">Elegí tu nueva contraseña</h2>
      <div class="stack">

        <label class="field"><span>Repetila</span><input type="password" id="np-pass2"/></label>
        <p class="errtext" id="np-err"></p>
        <button class="btn btn-primary btn-big" onclick="guardarNuevaPassword()">Guardar contraseña</button>
      </div>
    </div>
  `;
}
async function guardarNuevaPassword(){
  const pass = document.getElementById('np-pass').value;
  const pass2 = document.getElementById('np-pass2').value;
  const errEl = document.getElementById('np-err');
  errEl.textContent = '';
  if (pass.length < 6){ errEl.textContent = 'La contraseña necesita al menos 6 caracteres.'; return; }
  if (pass !== pass2){ errEl.textContent = 'Las dos contraseñas no coinciden.'; return; }
  const { error } = await sb.auth.updateUser({ password: pass });
  if (error){ errEl.textContent = traducirError(error.message); return; }
  modoRecuperarPassword = false;
  toast('Contraseña actualizada.');
  await render();

async function hacerLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-pass').value;
  const errEl = document.getElementById('li-err');
  errEl.textContent = '';
  if (!email || !password){ errEl.textContent = 'Completá email y contraseña.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ errEl.textContent = traducirError(error.message); return; }
  await render();
}
async function hacerSignup(){
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-pass').value;
  const errEl = document.getElementById('su-err');
  errEl.textContent = '';
  if (!email || !password){ errEl.textContent = 'Completá email y contraseña.'; return; }
  if (password.length < 6){ errEl.textContent = 'La contraseña necesita al menos 6 caracteres.'; return; }
  const { error } = await sb.auth.signUp({ email, password });
  if (error){ errEl.textContent = traducirError(error.message); return; }
  toast('Cuenta creada. Revisá tu email para confirmarla.');
  setAuthTab('login');
}
function traducirError(msg){
  if (/already registered|already exists/i.test(msg)) return 'Ese email ya tiene una cuenta creada.';
  if (/invalid login credentials/i.test(msg)) return 'Email o contraseña incorrectos.';
  if (/email not confirmed/i.test(msg)) return 'Todavía no confirmaste tu email — revisá tu casilla.';
  return msg;
}
async function cerrarSesion(){
  await sb.auth.signOut();
  await render();
}

async function guardarPerfil(){
  const nombre = document.getElementById('cp-nombre').value.trim();

function estadoFichaje(f){
  if (f.estado !== 'en_agua') return 'cerrado';
  const est = new Date(f.hora_estimada_salida).getTime();
  const ahora = Date.now();
  if (ahora < est) return 'ok';
  if (ahora - est < 30*60000) return 'recordatorio';
  return 'alerta';
}
function labelEquipoItem(e){
  if (e.tipo==='embarcacion') return (e.subtipo==='sup' ? 'SUP ' : 'Kayak ') + e.numero;
  if (e.tipo==='remo') return 'Remo ' + e.numero;
  return 'Chaleco ' + e.numero;
}
function labelPropio(tipo){ return tipo==='embarcacion' ? 'Trae su propia embarcación' : tipo==='remo' ? 'Trae su propio remo' : 'Trae su propio chaleco'; }
function labelPropioCorto(tipo){ return tipo==='embarcacion' ? 'Embarcación propia' : tipo==='remo' ? 'Remo propio' : 'Chaleco propio'; }
function labelDe(id, tipo){
  if (!id) return labelPropioCorto(tipo);
  const e = equipo.find(x=>x.id===id);
  return e ? labelEquipoItem(e) : '—';
}
function refreshEquipoSelect(selectId, tipo, soloPropio){
  const sel = document.getElementById(selectId);
  if (!sel) return;
  if (soloPropio){
    sel.innerHTML = `<option value="propio" selected>${labelPropio(tipo)}</option>`;
    return;
  }
  const disponibles = equipo.filter(e => e.tipo===tipo && e.estado==='disponible')
    .sort((a,b)=> (a.subtipo||'').localeCompare(b.subtipo||'') || a.numero-b.numero);
  sel.innerHTML = disponibles.map(e=>`<option value="${e.id}">${labelEquipoItem(e)}</option>`).join('') + `<option value="propio">${labelPropio(tipo)}</option>`;
}
function resolverSeleccion(selectId){
  const val = document.getElementById(selectId).value;
  return (!val || val === 'propio') ? null : val;
}

function renderMisCredenciales(){

async function ficharIngreso(){
  const errEl = document.getElementById('nf-err');
  const hora = document.getElementById('nf-hora').value;
  if (!hora){ errEl.textContent = 'Poné una hora estimada de salida.'; return; }
  const embarcacion_id = resolverSeleccion('nf-embarcacion');
  const remo_id = resolverSeleccion('nf-remo');
  const chaleco_id = resolverSeleccion('nf-chaleco');
  if (perfil.cuota_vencida && (embarcacion_id || remo_id || chaleco_id)){
    errEl.textContent = 'Tu cuota está vencida — solo podés fichar con equipo propio.';
    return;
  }
  const [hh,mm] = hora.split(':').map(Number);
  const est = new Date(); est.setHours(hh,mm,0,0);
  if (est.getTime() < Date.now()) est.setDate(est.getDate()+1);

  const { error } = await sb.from('fichajes').insert({
    socio_id: session.user.id, es_esporadico: false,
    embarcacion_id, remo_id, chaleco_id,
    hora_estimada_salida: est.toISOString(), marcado_por: 'socio'
  });
  if (error){ errEl.textContent = 'No se pudo fichar: ' + error.message; return; }
  await Promise.all([embarcacion_id, remo_id, chaleco_id].filter(Boolean).map(id => sb.from('equipo').update({estado:'en_uso'}).eq('id', id)));
  toast('Ingreso fichado. ¡Buena navegada!');
  await cargarDatos(); renderSocioContent();
  if (perfil.rol==='staff'||perfil.rol==='admin'){ renderStaffSummary(); renderStaffBoard(); renderStaffHistory(); }
}

async function ficharSalida(fichajeId, desdeStaff){

  const { error } = await sb.from('fichajes').update({ hora_salida_real: nowIso(), estado:'cerrado', marcado_por: desdeStaff?'staff':'socio' }).eq('id', fichajeId);
  if (error){ toast('No se pudo marcar la salida: ' + error.message); return; }

  if (perfil.rol==='staff'||perfil.rol==='admin'){ renderStaffSummary(); renderStaffBoard(); renderStaffHistory(); }

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function renderPushBanner(){
  const cont = document.getElementById('push-banner');
  if (!cont) return;
  const soportado = 'serviceWorker' in navigator && 'PushManager' in window;
  if (!soportado){ cont.innerHTML = ''; return; }
  if (Notification.permission === 'granted'){
    // Ya tiene permiso del navegador; nos aseguramos de que la suscripción
    // esté guardada en la base (por si se perdió, ej. tras reinstalar la PWA).
    asegurarSuscripcion().catch(()=>{});
    cont.innerHTML = '';
    return;
  }
  if (Notification.permission === 'denied'){
    cont.innerHTML = `<p class="hint" style="margin:0 0 4px;">🔕 Tenés las notificaciones bloqueadas en este navegador. Activalas desde la configuración del sitio si querés recibir avisos.</p>`;
    return;
  }
  cont.innerHTML = `
    <div class="card" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <span class="hint" style="margin:0;">🔔 Activá las notificaciones para recibir el recordatorio de salida.</span>
      <button class="btn btn-primary" onclick="activarNotificaciones()">Activar notificaciones</button>
    </div>`;
}

async function activarNotificaciones(){
  try{
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted'){ toast('No se activaron las notificaciones.'); renderPushBanner(); return; }
    await asegurarSuscripcion();
    toast('¡Notificaciones activadas!');
  } catch(e){
    toast('No se pudo activar: ' + e.message);
  }
  renderPushBanner();
}

async function asegurarSuscripcion(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub){
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }
  const json = sub.toJSON();
  await sb.from('push_subscriptions').upsert({
    user_id: session.user.id,
    endpoint: json.endpoint,
    p256dh: json.keys.p256dh,
    auth: json.keys.auth
  }, { onConflict: 'endpoint' });
}

  await sb.from('perfiles').update({ cuota_vencida: false }).eq('id', socioId);
  toast('Cuota marcada como pagada.');
  await cargarDatosStaffCuotas(); refrescarSelectSocios(); renderStaffVencidos(); renderPagosSinAsociar();
}

async function asociarPago(pagoId){
  const sel = document.getElementById('asociar-'+pagoId);
  const socioId = sel ? sel.value : '';
  if (!socioId){ toast('Elegí a qué socio corresponde.'); return; }
  const pago = pagosSinAsociar.find(p=>p.id===pagoId);
  if (!pago) return;
  const { error: e1 } = await sb.from('cuotas').upsert({
    socio_id: socioId, periodo: pago.periodo, monto: pago.monto, fecha_pago: pago.fecha_pago,
    medio: 'mercado_pago', mp_payment_id: pago.mp_payment_id
  }, { onConflict: 'socio_id,periodo' });
  if (e1){ toast('No se pudo asociar: ' + e1.message); return; }
  await sb.from('perfiles').update({ cuota_vencida: false }).eq('id', socioId);
  await sb.from('pagos_sin_asociar').update({ estado:'asociado', asociado_a: socioId, resuelto_por: session.user.id, resuelto_en: nowIso() }).eq('id', pagoId);
  toast('Pago asociado.');
  await cargarDatosStaffCuotas(); refrescarSelectSocios(); renderStaffVencidos(); renderPagosSinAsociar();
}
</script>
